<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embedded Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg: #0f1724;
  --card: #0b1220;
  --muted: #98a0b3;
  --text: #e6eef8;
  --accent: #5ee7df;
  --accent-rgb: 94,231,223;
  --radius: 12px;
  --nav-height: 64px;
}

* { box-sizing: border-box; }
html,body { height:100%; margin:0; font-family:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:var(--bg); color:var(--text); }

.topbar{
  position: sticky;
  top:0;
  z-index:50;
  height: var(--nav-height);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  padding:0 20px;
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(255,255,255,0.03);
  box-shadow: 0 6px 18px rgba(2,6,23,0.6);
}

.brand{ font-weight:700; font-size:18px; display:flex; align-items:center; gap:6px;}
.brand svg{width:24px;height:24px;}

nav.navlinks{ display:flex; gap:10px; align-items:center; }

.navlink {
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:10px 14px;
  border-radius: 10px;
  background: transparent;
  color:var(--text);
  text-decoration:none;
  font-weight:600;
  font-size:14px;
  border: 1px solid transparent;
  transition: transform 180ms ease, box-shadow 220ms ease, background-color 220ms ease;
  cursor:pointer;
}

.navlink svg{width:16px; height:16px; fill:var(--text);}

.navlink:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(var(--accent-rgb),0.12), 0 2px 8px rgba(0,0,0,0.45);
  border-color: rgba(var(--accent-rgb),0.14);
  background: linear-gradient(180deg, rgba(255,255,255,0.012), rgba(255,255,255,0.01));
}

iframe{
  width:100%;
  height:calc(100vh - var(--nav-height));
  border:none;
  background:#000;
}

/* mobile nav toggle */
.hamburger{
  display:none;
  cursor:pointer;
  font-size:28px;
  user-select:none;
  color:var(--text);
}
@media (max-width:820px){
  .navlinks{ display:none; position:absolute; right:18px; top:calc(var(--nav-height) + 12px); flex-direction:column; background:var(--card); padding:10px; border-radius:10px; box-shadow:0 10px 30px rgba(2,6,23,0.6); min-width:180px; border:1px solid rgba(255,255,255,0.02);}
  .navlinks.show{ display:flex; }
  .hamburger{ display:flex; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <!-- small logo icon -->
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="none" fill="var(--accent)"/></svg>
    Embedded Dashboard
  </div>

  <nav class="navlinks" role="navigation">
    <a class="navlink" data-url="home" href="#">
      <!-- home icon -->
      <svg viewBox="0 0 24 24"><path d="M3 12L12 3l9 9v9a3 3 0 0 1-3 3h-12a3 3 0 0 1-3-3v-9z"/></svg>
      Home
    </a>
    <a class="navlink" data-url="https://readingsubject.emploi.cl" href="#">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/></svg>
      Petezah
    </a>
    <a class="navlink" data-url="https://mathlookscool.emploi.cl" href="#">
      <svg viewBox="0 0 24 24"><path d="M12 2l7 7-7 7-7-7 7-7z"/></svg>
      Shadow
    </a>
    <a class="navlink" data-url="settings" href="#">
      <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0-6v2m0 16v2m8-10h2M2 12h2m15.364-7.364l1.414 1.414M4.222 19.778l1.414-1.414M19.778 19.778l-1.414-1.414M4.222 4.222l1.414 1.414"/></svg>
      Settings
    </a>
  </nav>

  <div class="hamburger" id="hambBtn">&#9776;</div>
</header>

<iframe id="contentFrame" srcdoc="<h1 style='color:white;text-align:center;margin-top:20%;font-family:Inter;'>Welcome Home!<br>Click a button above to load a site.</h1>"></iframe>

<script>
const links = document.querySelectorAll('.navlink');
const iframe = document.getElementById('contentFrame');
const hambBtn = document.getElementById('hambBtn');
const nav = document.querySelector('.navlinks');

// button clicks
links.forEach(link => {
  link.addEventListener('click', e => {
    e.preventDefault();
    const url = link.dataset.url;

    if(url === 'home'){
      iframe.srcdoc = "<h1 style='color:white;text-align:center;margin-top:20%;font-family:Inter;'>Welcome Home!<br>Click a button above to load a site.</h1>";
    } else if(url === 'settings'){
      iframe.srcdoc = "<h1 style='color:white;text-align:center;margin-top:20%;font-family:Inter;'>Settings Page<br>Add your settings here!</h1>";
    } else {
      iframe.src = url;
    }

    // close mobile nav if open
    if(nav.classList.contains('show')) nav.classList.remove('show');
  });
});

// mobile toggle
hambBtn.addEventListener('click', () => {
  nav.classList.toggle('show');
});

// close menu clicking outside
document.addEventListener('click', e => {
  if(!nav.contains(e.target) && !hambBtn.contains(e.target)){
    nav.classList.remove('show');
  }
});
</script>

</body>
</html>
